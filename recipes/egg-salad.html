    <h2>What is Egg Salad Recipe</h2>
      <p>This egg salad with ranch dressing is simple but still delicious! Great for leftover Easter eggs.</p>
    <h2>Ingredients</h2>
      <ul>
        <li>6 hard-cooked eggs</li>
        <li>¼ cup chopped cucumber</li>
        <li>3 tbsp ranch dressing</li>
        <li>1 tbsp mustard</li>
        <li>salt and ground black pepper to taste</li>
      </ul>
